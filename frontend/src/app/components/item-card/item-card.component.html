<button
  class="group relative w-full border border-zinc-800 bg-zinc-900 p-3 text-left transition hover:border-zinc-600"
  [class.opacity-40]="checked"
  [class.line-through]="checked"
  type="button"
  (click)="toggled.emit()"
>
  <div class="flex items-start justify-between gap-2">
    <div>
      <p class="text-sm text-zinc-100">{{ item.name }}</p>
      <p class="font-mono text-xs text-zinc-500">x{{ item.quantity }}</p>
    </div>
    <span class="border border-amber-700/60 bg-amber-500/10 px-2 py-0.5 font-mono text-[10px] uppercase tracking-wide text-amber-300">
      {{ item.badge }}
    </span>
  </div>

  @if (item.yields.length) {
    <div class="pointer-events-none absolute left-0 top-full z-10 hidden w-64 border border-zinc-700 bg-zinc-950 p-3 text-xs text-zinc-300 group-hover:block">
      <p class="font-mono uppercase tracking-wide text-amber-400">Yields</p>
      <p class="mt-2 text-zinc-500">In-stash</p>
      @for (row of stashYields; track row.item_id + row.context) {
        <p>{{ row.name }} x{{ row.quantity }}</p>
      }
      <p class="mt-2 text-zinc-500">In-raid</p>
      @for (row of raidYields; track row.item_id + row.context) {
        <p>{{ row.name }} x{{ row.quantity }}</p>
      }
    </div>
  }
</button>
