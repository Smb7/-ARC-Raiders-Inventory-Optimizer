<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true">
  <div class="w-full max-w-lg border border-zinc-700 bg-zinc-950 p-6 shadow-2xl">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-amber-400">Stash connection</p>
    <h2 class="mt-2 text-xl text-zinc-100">Connect with a read-only token</h2>
    <p class="mt-3 text-sm text-zinc-400">
      Get your personal API token from
      <span class="font-mono text-amber-300">arctracker.io</span>. This app only reads your stash.
    </p>

    <label class="mt-6 block text-sm text-zinc-300" for="api-token">API Token / Bearer Token</label>
    <input
      id="api-token"
      class="mt-2 w-full border border-zinc-700 bg-zinc-900 px-3 py-2 font-mono text-sm text-zinc-100 outline-none focus:border-amber-400"
      type="password"
      [(ngModel)]="token"
      name="token"
      autocomplete="off"
    />

    <label class="mt-4 flex items-center gap-2 text-sm text-zinc-400">
      <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
      Remember me
    </label>

    @if (status) {
      <p class="mt-4 font-mono text-sm text-amber-300">{{ status }}</p>
    }
    @if (error) {
      <p class="mt-4 text-sm text-red-400">{{ error }}</p>
    }

    <div class="mt-6 flex justify-end gap-3">
      <button class="px-3 py-2 text-sm text-zinc-400 hover:text-zinc-200" type="button" (click)="closed.emit()">
        Cancel
      </button>
      <button
        class="border border-amber-500 bg-amber-500 px-4 py-2 font-mono text-sm text-zinc-950 disabled:opacity-60"
        type="button"
        [disabled]="loading"
        (click)="connect()"
      >
        {{ loading ? 'Connecting...' : 'Connect & Scan' }}
      </button>
    </div>
  </div>
</div>
